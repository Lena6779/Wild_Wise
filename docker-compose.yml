services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build: ./backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_data
      - db_data:/app/data
    depends_on:
      - ollama

  frontend:
    build: ./frontend
    env_file:
      - .env
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  ollama_data:
  chroma_data:
  db_data:        