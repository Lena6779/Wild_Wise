# Wild Wise: Ollama, the FastAPI backend, and the Streamlit frontend
services:
  # The language model: no ports, since only the backend talks to it
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build: ./backend
    # Settings and the JWT secret, loaded when the container starts
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_data
      - db_data:/app/data
    depends_on:
      - ollama

  frontend:
    build: ./frontend
    env_file:
      - .env
    ports:
      - "8501:8501"
    depends_on:
      - backend

# Saved data that survives each restart: the model, chunks, and the database
volumes:
  ollama_data:
  chroma_data:
  db_data:        