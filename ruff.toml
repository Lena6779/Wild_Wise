# Ruff linter settings for Wild Wise
line-length = 88
# Our own code lives in backend/, for import sorting
src = ["backend"]

[lint]
# E/W = style, F = real errors, I = import order, B = common bugs
select = ["E", "F", "W", "I", "B"]
# Allow long lines of code
ignore = ["E501"]

[lint.flake8-bugbear]
# FastAPI's Depends() and Query() are safe in function arguments
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]